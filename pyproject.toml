[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "jsonscraper"
version = "0.1.0"
description = "Python SDK for jsonscraper Instagram and TikTok APIs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["instagram", "tiktok", "api", "sdk", "jsonscraper"]
[project.urls]
Homepage = "https://jsonscraper.com"
Repository = "https://github.com/jsonscraper/jsonscraper-python"
[tool.setuptools.packages.find]
where = ["src"]
